[package]
name = "mistral"
version = "0.1.1"
description = "Native Mistral chat client for Kujo with an AI SDK driver."
license = "MIT"
repository = "https://github.com/kujolang/mistral"
readme = "README.md"
[package.status]
stage = "experimental"
stability = "early"
public_api = true
[kujo]
minimum_version = "1.6.0"
entry = "mistral.kujo"
sources = ["src", "."]
includes = ["docs", "examples", "README.md", "CHANGELOG.md", "tests", "AGENTS.md", "docs/MISTRAL_IMPLEMENTATION_REPORT.md", "docs/MISTRAL_PROVIDER_PACKAGE_CONFORMANCE.md"]
excludes = [".git", "dist", "build", "kennel_packages"]
[dependencies]
ai-sdk = { source = "github:kujolang/ai-sdk", commit = "f3126dded28102f40d0ddecd50a559105c66f905" }
[scripts]
test = "bash scripts/release_quality_gate.sh"
verify-offline = "bash scripts/release_quality_gate.sh"
[package.exports]
mistral = "src/mistral.kujo"
provider = "src/provider.kujo"
